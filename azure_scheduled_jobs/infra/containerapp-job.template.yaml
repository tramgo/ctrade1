location: __LOCATION__
name: __JOB_NAME__
identity:
  type: UserAssigned
  userAssignedIdentities:
    __USER_ASSIGNED_IDENTITY_ID__: {}
properties:
  environmentId: __ENVIRONMENT_ID__
  configuration:
    triggerType: Schedule
    replicaTimeout: 3600
    replicaRetryLimit: 0
    scheduleTriggerConfig:
      cronExpression: "__CRON__"
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: api-key
        value: "__API_KEY__"
      - name: api-secret
        value: "__API_SECRET__"
      - name: kite-username
        value: "__USERNAME__"
      - name: kite-password
        value: "__PASSWORD__"
      - name: totp-key
        value: "__TOTP_KEY__"
      - name: github-token
        value: "__GITHUB_TOKEN__"
    registries:
      - server: __ACR_SERVER__
        identity: __USER_ASSIGNED_IDENTITY_ID__
  template:
    containers:
      - name: ctrade1
        image: __IMAGE__
        args:
          - "__JOB_KIND__"
        env:
          - name: SSELL1_NONINTERACTIVE
            value: "1"
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
          - name: PYTHONPYCACHEPREFIX
            value: "/tmp/codex_pycache"
          - name: API_KEY
            secretRef: api-key
          - name: API_SECRET
            secretRef: api-secret
          - name: USERNAME
            secretRef: kite-username
          - name: PASSWORD
            secretRef: kite-password
          - name: TOTP_KEY
            secretRef: totp-key
          - name: GITHUB_TOKEN
            secretRef: github-token
          - name: GITHUB_OUTPUT_PUSH_ENABLED
            value: "__GITHUB_OUTPUT_PUSH_ENABLED__"
          - name: GITHUB_REPO_URL
            value: "__GITHUB_REPO_URL__"
          - name: GITHUB_BRANCH
            value: "__GITHUB_BRANCH__"
          - name: GENERATED_OUTPUT_PATHS
            value: "__GENERATED_OUTPUT_PATHS__"
        resources:
          cpu: 1.0
          memory: 2Gi
        volumeMounts:
          - mountPath: /app/results
            volumeName: ctrade1-results
          - mountPath: /app/data
            volumeName: ctrade1-data
    volumes:
      - name: ctrade1-results
        storageType: AzureFile
        storageName: ctrade1results
      - name: ctrade1-data
        storageType: AzureFile
        storageName: ctrade1data
